name: Android CI

on:
  push:
    branches:
      - feature/T0-Base

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - run: chmod +x gradlew

      - name: Build App
        run: ./gradlew assembleDebug